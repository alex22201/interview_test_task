name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: redirect_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/redirect_service

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pinned to an exact tag: setup-uv stopped publishing moving major tags after v7,
      # so `@v10` does not resolve even though release v10.0.1 exists.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs the same hooks as the local pre-commit install, so CI and a developer's
      # machine cannot drift apart on linting or formatting.
      - name: Lint (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Collect static files
        run: uv run python src/manage.py collectstatic --noinput

      - name: Validate OpenAPI schema
        run: uv run python src/manage.py spectacular --file /dev/null --fail-on-warn

      - name: Run tests
        run: uv run pytest
